<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Astrological identicon builder</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f4f4f7;
      background: #0d0d13;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1c1c2b 0, #0d0d13 48rem);
    }

    button,
    input,
    select {
      font: inherit;
    }

    main {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 3.5rem) 0;
    }

    header {
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4vw, 2.65rem);
      letter-spacing: -0.04em;
    }

    header p {
      max-width: 62ch;
      margin: 0.6rem 0 0;
      color: #aaaabb;
      line-height: 1.55;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(18rem, 0.85fr) minmax(20rem, 1.15fr);
      gap: clamp(1rem, 3vw, 2rem);
      align-items: start;
    }

    .panel {
      border: 1px solid #292936;
      border-radius: 1.25rem;
      background: rgba(20, 20, 29, 0.9);
      box-shadow: 0 1.2rem 4rem rgba(0, 0, 0, 0.22);
    }

    form {
      padding: clamp(1rem, 3vw, 1.5rem);
    }

    .field {
      display: grid;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    label {
      color: #cfcfda;
      font-size: 0.9rem;
      font-weight: 650;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #373748;
      border-radius: 0.75rem;
      background: #15151f;
      color: #f7f7fb;
      padding: 0.72rem 0.8rem;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #8585aa;
      box-shadow: 0 0 0 3px rgba(133, 133, 170, 0.16);
    }

    .seed {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.55rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 0.8rem;
    }

    button {
      border: 0;
      border-radius: 0.78rem;
      padding: 0.76rem 1rem;
      cursor: pointer;
      font-weight: 720;
    }

    .secondary {
      background: #292938;
      color: #e7e7ef;
    }

    .primary {
      width: 100%;
      background: #f1f1f7;
      color: #171720;
      margin-top: 0.35rem;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.58;
    }

    .preview-panel {
      padding: clamp(0.8rem, 2.5vw, 1.2rem);
    }

    .preview {
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid #30303e;
      border-radius: 50%;
      background: #111;
    }

    .preview>svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem;
      margin-top: 0.85rem;
    }

    .swatch {
      min-width: 0;
      border: 1px solid #31313e;
      border-radius: 0.72rem;
      overflow: hidden;
      background: #171720;
    }

    .swatch-colour {
      height: 2.25rem;
    }

    .swatch-copy {
      padding: 0.5rem 0.6rem;
    }

    .swatch-copy strong,
    .swatch-copy code {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .swatch-copy strong {
      font-size: 0.72rem;
      color: #9999aa;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .swatch-copy code {
      margin-top: 0.16rem;
      color: #ededf5;
    }

    .status {
      min-height: 1.4em;
      margin: 0.75rem 0 0;
      color: #aaaabb;
      font-size: 0.88rem;
    }

    .status.error {
      color: #ff9eaa;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .preview-panel {
        order: -1;
      }
    }

    @media (max-width: 460px) {
      main {
        width: min(100% - 1rem, 1180px);
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .palette {
        gap: 0.35rem;
      }

      .swatch-copy {
        padding: 0.45rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Astrological identicon builder</h1>
      <p>Compose a deterministic, self-contained SVG from existing zodiac vectors and a seed-derived analogous palette.
      </p>
    </header>

    <div class="layout">
      <section class="panel">
        <form id="builder">
          <div class="field">
            <label for="seed">Seed</label>
            <div class="seed">
              <input id="seed" name="seed" value="6270f2-example-seed" autocomplete="off" required>
              <button id="random" class="secondary" type="button">New seed</button>
            </div>
          </div>

          <div class="grid" id="sign-fields"></div>
          <button id="save" class="primary" type="submit">Save standalone SVG</button>
          <p id="status" class="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel preview-panel">
        <div id="preview" class="preview" aria-label="Identicon preview"></div>
        <div id="palette" class="palette"></div>
      </section>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>

</html>
