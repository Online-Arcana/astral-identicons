<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>Astrological identicon builder</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f4f4f7;
      background: #0d0d13;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1c1c2b 0, #0d0d13 48rem);
    }

    button,
    input,
    select {
      font: inherit;
    }

    main {
      width: min(1180px, calc(100% - 2rem));
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 3.5rem) 0;
    }

    header {
      margin-bottom: 1.5rem;
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: -0.04em;
    }

    h1 {
      font-size: clamp(1.65rem, 4vw, 2.65rem);
    }

    h2 {
      font-size: clamp(1.2rem, 3vw, 1.7rem);
    }

    header p {
      max-width: 62ch;
      margin: 0.6rem 0 0;
      color: #aaaabb;
      line-height: 1.55;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(18rem, 0.85fr) minmax(20rem, 1.15fr);
      gap: clamp(1rem, 3vw, 2rem);
      align-items: start;
    }

    .panel {
      border: 1px solid #292936;
      border-radius: 1.25rem;
      background: rgba(20, 20, 29, 0.9);
      box-shadow: 0 1.2rem 4rem rgba(0, 0, 0, 0.22);
    }

    form {
      padding: clamp(1rem, 3vw, 1.5rem);
    }

    .field {
      display: grid;
      gap: 0.45rem;
      margin-bottom: 1rem;
    }

    label {
      color: #cfcfda;
      font-size: 0.9rem;
      font-weight: 650;
    }

    input,
    select {
      width: 100%;
      border: 1px solid #373748;
      border-radius: 0.75rem;
      background: #15151f;
      color: #f7f7fb;
      padding: 0.72rem 0.8rem;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #8585aa;
      box-shadow: 0 0 0 3px rgba(133, 133, 170, 0.16);
    }

    .seed {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.55rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 0.8rem;
    }

    .actions,
    .scan-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.55rem;
    }

    button {
      border: 0;
      border-radius: 0.78rem;
      padding: 0.76rem 1rem;
      cursor: pointer;
      font-weight: 720;
    }

    .secondary {
      background: #292938;
      color: #e7e7ef;
    }

    .primary {
      background: #f1f1f7;
      color: #171720;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.58;
    }

    .preview-panel {
      padding: clamp(0.8rem, 2.5vw, 1.2rem);
    }

    .preview {
      aspect-ratio: 1;
      overflow: hidden;
      border: 1px solid #30303e;
      border-radius: 50%;
      background: #111;
    }

    .preview>svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.55rem;
      margin-top: 0.85rem;
    }

    .swatch {
      min-width: 0;
      border: 1px solid #31313e;
      border-radius: 0.72rem;
      overflow: hidden;
      background: #171720;
    }

    .swatch-colour {
      height: 2.25rem;
    }

    .swatch-copy {
      padding: 0.5rem 0.6rem;
    }

    .swatch-copy strong,
    .swatch-copy code {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .swatch-copy strong {
      font-size: 0.72rem;
      color: #9999aa;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .swatch-copy code {
      margin-top: 0.16rem;
      color: #ededf5;
    }

    .status,
    .scan-status {
      min-height: 1.4em;
      color: #aaaabb;
      font-size: 0.88rem;
      line-height: 1.45;
    }

    .status {
      margin: 0.75rem 0 0;
    }

    .status.error,
    .scan-status.error {
      color: #ff9eaa;
    }

    .scan-status.success {
      color: #b7f6c7;
    }

    dialog.scan-dialog {
      width: min(44rem, calc(100% - 1rem));
      max-height: calc(100dvh - 1rem);
      padding: 0;
      overflow: auto;
      border: 1px solid #343447;
      border-radius: 1.2rem;
      color: #f4f4f7;
      background: #11111a;
      box-shadow: 0 2rem 8rem rgba(0, 0, 0, 0.7);
    }

    dialog.scan-dialog::backdrop {
      background: rgba(4, 4, 9, 0.78);
      backdrop-filter: blur(0.4rem);
    }

    .scan-shell {
      padding: clamp(0.75rem, 2.5vw, 1.2rem);
    }

    .scan-copy {
      margin-bottom: 0.8rem;
    }

    .scan-copy p {
      margin: 0.35rem 0 0;
      color: #aaaabb;
      line-height: 1.45;
    }

    .scan-stage {
      position: relative;
      width: min(100%, 36rem);
      aspect-ratio: 1;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #343447;
      border-radius: 1rem;
      background: #050507;
    }

    .scan-stage video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scan-guide {
      position: absolute;
      inset: 6%;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      box-shadow:
        0 0 0 999px rgba(0, 0, 0, 0.28),
        inset 0 0 0 1px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    .scan-guide::before,
    .scan-guide::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.55);
    }

    .scan-guide::before {
      left: 50%;
      top: -0.45rem;
      width: 1px;
      height: 0.9rem;
    }

    .scan-guide::after {
      top: 50%;
      left: -0.45rem;
      width: 0.9rem;
      height: 1px;
    }

    .scan-result {
      display: grid;
      grid-template-columns: 5rem 1fr;
      gap: 0.7rem;
      align-items: center;
      margin: 0.8rem 0;
    }

    #scan-normalised {
      width: 5rem;
      height: 5rem;
      border: 1px solid #353548;
      border-radius: 50%;
      background: #08080d;
    }

    #scan-capture {
      display: none;
    }

    .scan-status {
      margin: 0;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .preview-panel {
        order: -1;
      }
    }

    @media (max-width: 460px) {
      main {
        width: min(100% - 1rem, 1180px);
      }

      .grid,
      .actions,
      .scan-actions {
        grid-template-columns: 1fr;
      }

      .palette {
        gap: 0.35rem;
      }

      .swatch-copy {
        padding: 0.45rem;
      }

      dialog.scan-dialog {
        width: calc(100% - 0.5rem);
        max-height: calc(100dvh - 0.5rem);
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Astrological identicon builder</h1>
      <p>Compose a deterministic, self-contained SVG from existing zodiac vectors and a recoverable visual seed.</p>
    </header>

    <div class="layout">
      <section class="panel">
        <form id="builder">
          <div class="field">
            <label for="seed">Seed</label>
            <div class="seed">
              <input id="seed" name="seed" value="6270f2-example-seed" autocomplete="off" required>
              <button id="random" class="secondary" type="button">New seed</button>
            </div>
          </div>

          <div class="grid" id="sign-fields"></div>
          <div class="actions">
            <button id="scan" class="secondary" type="button">Scan identicon</button>
            <button id="save" class="primary" type="submit">Save standalone SVG</button>
          </div>
          <p id="status" class="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="panel preview-panel">
        <div id="preview" class="preview" aria-label="Identicon preview"></div>
        <div id="palette" class="palette"></div>
      </section>
    </div>
  </main>

  <dialog id="scan-dialog" class="scan-dialog" aria-labelledby="scan-heading">
    <section class="scan-shell">
      <div class="scan-copy">
        <h2 id="scan-heading">Read an astral identicon</h2>
        <p>The camera remains inside this page. Hold the complete circular mark flat, evenly lit and inside the guide.</p>
      </div>

      <div class="scan-stage">
        <video id="scan-video" autoplay muted playsinline></video>
        <div class="scan-guide" aria-hidden="true"></div>
      </div>

      <canvas id="scan-capture" width="720" height="720" aria-hidden="true"></canvas>

      <div class="scan-result">
        <canvas id="scan-normalised" width="1024" height="1024" aria-label="Normalised scanner frame"></canvas>
        <p id="scan-status" class="scan-status" aria-live="polite">Camera is not running.</p>
      </div>

      <div class="scan-actions">
        <button id="scan-close" class="secondary" type="button">Close</button>
        <button id="scan-read" class="primary" type="button">Read frame</button>
      </div>
    </section>
  </dialog>

  <script type="module" src="/app.js"></script>
</body>

</html>
