name: Apply clean expanded V10 shell

on:
  push:
    branches:
      - agent/clean-v10-shell

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Apply V10 geometry and shell changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          renderer = Path('src/legacy/renderer/identiconV10.ts')
          text = renderer.read_text()
          text = replace_once(
              text,
              'import { parityLayer, v9InnerClipRadius } from "./identiconV9Geometry.js";\n',
              'import { parityLayer, v9InnerClipRadius } from "./identiconV9Geometry.js";\nimport { v10OverlayRadius, v10OverlayScale } from "../../layout-v10.js";\n',
              'renderer overlay-layout import',
          )
          text = replace_once(text, '  aspect: 210,\n', '', 'unused aspect radius')
          houses = '''function housesLayer(request: AstralIdenticonV10Request, ascendant: number): string {
            const wheel = request.wheel;
            if (wheel === null || wheel.points.ascendant === null || wheel.houses.status === "unavailable") return "";
            const houses: string[] = [];
            for (let number = 1; number <= 12; number += 1) {
              const house = wheel.houses.houses[String(number)];
              if (house === undefined || house.cuspLongitudeDegrees === null || house.endLongitudeDegrees === null) continue;
              houses.push(`<path d="${sectorPath(house.cuspLongitudeDegrees, house.endLongitudeDegrees, radii.aspect, radii.zodiacInner, ascendant)}" fill="${request.palette.layer0}" fill-opacity="0.018"/>`);
              const angular = [1, 4, 7, 10].includes(number);
              houses.push(line(
                house.cuspLongitudeDegrees,
                radii.aspect,
                radii.zodiacInner,
                ascendant,
                request.palette.layer1,
                angular ? 0.78 : 0.28,
                angular ? 2.6 : 1.25,
              ));
            }
            return `<g id="wheel-houses">${houses.join("")}</g>`;
          }

          '''.replace('          ', '')
          text = replace_once(text, houses, '', 'house layer')
          point_lines = '''    parts.push(line(point.longitude, radii.zodiacInner - 3, radius + 16, ascendant, request.palette.layer1, 0.23, 1));
              parts.push(line(point.longitude, radii.zodiacInner - 10, radii.zodiacInner + 1, ascendant, request.palette.layer1, 0.76, 1.8));
          '''.replace('          ', '')
          text = replace_once(text, point_lines, '', 'planet-position tick and leader lines')
          text = replace_once(
              text,
              '  const scale = (radii.aspect - 8) / v9InnerClipRadius;\n',
              '  const scale = v10OverlayScale;\n',
              'overlay scale',
          )
          old_metadata = '  <metadata>Astral chart identicon visual contract v10. The deterministic natal chart wheel supplies the zodiac, selected houses and real chart points. Aspect lines are deliberately omitted. The aspect area contains only the Solar constellation artwork and the one hundred and twenty-eight RS(168,40) parity stars. The former encoded planetary glyphs, satellites, literal six-sign grid and separate identicon zodiac ring are not rendered.</metadata>'
          new_metadata = '  <metadata>Astral chart identicon visual contract v10. The deterministic natal chart wheel supplies the zodiac ring and real planetary chart points. House divisions, house labels and aspect lines are deliberately omitted. The identicon field expands to the inner edge of the zodiac ring and contains the Solar constellation artwork and the one hundred and twenty-eight RS(168,40) parity stars. The former encoded planetary glyphs, satellites, literal six-sign grid and separate identicon zodiac ring are not rendered.</metadata>'
          text = replace_once(text, old_metadata, new_metadata, 'V10 metadata')
          text = replace_once(
              text,
              '    <clipPath id="identicon-aspect-clip"><circle cx="${centre}" cy="${centre}" r="${radii.aspect - 4}"/></clipPath>',
              '    <clipPath id="identicon-aspect-clip"><circle cx="${centre}" cy="${centre}" r="${v10OverlayRadius}"/></clipPath>',
              'overlay clip radius',
          )
          text = replace_once(text, '  ${housesLayer(request, ascendant)}\n', '', 'house layer render call')
          renderer.write_text(text)

          layout = Path('src/layout-v10.ts')
          text = layout.read_text()
          text = replace_once(
              text,
              'export const v10OverlayRadius = v10AspectRadius - 8;\n',
              'export const v10OverlayRadius = v10ZodiacInnerRadius;\n',
              'scanner overlay radius',
          )
          layout.write_text(text)

          tests = Path('tests/v10.test.ts')
          text = tests.read_text()
          old = '''    expect(svg).toContain('id="wheel-zodiac"');
            expect(svg).toContain('id="wheel-houses"');
            const houseLayer = svg.match(/<g id="wheel-houses">([\\s\\S]*?)<\\/g>/u)?.[1] ?? "";
            expect(houseLayer).not.toContain("<text");
            expect(svg).toContain('id="wheel-points"');
          '''.replace('          ', '')
          new = '''    expect(svg).toContain('id="wheel-zodiac"');
            expect(svg).not.toContain('id="wheel-houses"');
            expect(svg).toContain('id="wheel-points"');
          '''.replace('          ', '')
          text = replace_once(text, old, new, 'V10 house-layer regression')
          text = replace_once(
              text,
              '    expect(count(svg, /data-parity-index=/gu)).toBe(128);\n',
              '    expect(count(svg, /data-parity-index=/gu)).toBe(128);\n    expect(count(svg, /<line /gu)).toBe(72);\n',
              'V10 point-line regression',
          )
          text = replace_once(
              text,
              "  expect(svg).toContain('id=\"wheel-houses\"');\n",
              "  expect(svg).not.toContain('id=\"wheel-houses\"');\n",
              'planet collection house expectation',
          )
          tests.write_text(text)

          scanner = Path('tests/v10-scanner.test.ts')
          text = scanner.read_text()
          text = replace_once(
              text,
              '  v10OuterRingRadius,\n  v10ParityAnchorPoint,\n',
              '  v10OuterRingRadius,\n  v10OverlayRadius,\n  v10ParityAnchorPoint,\n',
              'scanner test overlay-radius import',
          )
          text = replace_once(
              text,
              '  v10ParityStarSizes,\n  v10RingRatio\n',
              '  v10ParityStarSizes,\n  v10RingRatio,\n  v10ZodiacInnerRadius\n',
              'scanner test zodiac-inner import',
          )
          marker = 'describe("v10 parity-only scanner", () => {\n'
          addition = '''describe("v10 parity-only scanner", () => {
            test("expands the scannable field to the zodiac ring", () => {
              expect(v10OverlayRadius).toBe(v10ZodiacInnerRadius);
            });

          '''.replace('          ', '')
          text = replace_once(text, marker, addition, 'scanner overlay-boundary regression')
          scanner.write_text(text)
          PY
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build:pages
      - name: Commit verified implementation
        run: |
          git add src/legacy/renderer/identiconV10.ts src/layout-v10.ts tests/v10.test.ts tests/v10-scanner.test.ts
          if git diff --cached --quiet; then
            echo "V10 shell changes already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clean and expand V10 identicon shell"
          git push origin HEAD:agent/clean-v10-shell
