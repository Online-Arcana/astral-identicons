name: Remove V10 house labels

on:
  push:
    branches:
      - agent/remove-house-numbers

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Remove house labels and add regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          renderer = Path('src/legacy/renderer/identiconV10.ts')
          text = renderer.read_text()
          pattern = re.compile(
              r'    const middle = normalise\(house\.cuspLongitudeDegrees \+ forwardDistance\(house\.cuspLongitudeDegrees, house\.endLongitudeDegrees\) / 2\);\n'
              r'    const label = polar\(middle, 233, ascendant\);\n'
              r'    houses\.push\(`<text x="\$\{label\.x\.toFixed\(3\)\}" y="\$\{\(label\.y \+ 5\)\.toFixed\(3\)\}" fill="\$\{request\.palette\.layer1\}" fill-opacity="0\.65" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="800" text-anchor="middle">\$\{number\}</text>`\);\n'
          )
          text, count = pattern.subn('', text, count=1)
          if count == 0 and 'font-size="15" font-weight="800" text-anchor="middle">${number}</text>' in text:
              raise SystemExit('V10 house label block changed unexpectedly')
          renderer.write_text(text)

          tests = Path('tests/v10.test.ts')
          text = tests.read_text()
          if 'houseLayer).not.toContain("<text")' not in text:
              marker = '''    expect(svg).toContain('id="wheel-houses"');
            expect(svg).toContain('id="wheel-points"');'''
              marker = marker.replace('            expect(svg).toContain(\'id="wheel-points"\');', '    expect(svg).toContain(\'id="wheel-points"\');')
              addition = '''    expect(svg).toContain('id="wheel-houses"');
            const houseLayer = svg.match(/<g id="wheel-houses">([\\s\\S]*?)<\\/g>/u)?.[1] ?? "";
            expect(houseLayer).not.toContain("<text");
            expect(svg).toContain('id="wheel-points"');'''
              addition = addition.replace('            const houseLayer', '    const houseLayer').replace('            expect(houseLayer)', '    expect(houseLayer)').replace('            expect(svg).toContain(\'id="wheel-points"\');', '    expect(svg).toContain(\'id="wheel-points"\');')
              if marker not in text:
                  raise SystemExit('V10 wheel-house test marker changed unexpectedly')
              text = text.replace(marker, addition, 1)
          tests.write_text(text)
          PY
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build:pages
      - name: Commit verified implementation
        run: |
          git add src/legacy/renderer/identiconV10.ts tests/v10.test.ts
          if git diff --cached --quiet; then
            echo "Unlabelled houses already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove house labels from V10 identicons"
          git push origin HEAD:agent/remove-house-numbers
