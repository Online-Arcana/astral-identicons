name: tmp-reclaim-legacy-renderers
on:
  push:
    branches: [agent/split-modules]
    paths: [.github/workflows/tmp-reclaim-legacy-renderers.yml]
permissions:
  contents: write
jobs:
  reclaim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/split-modules
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Move v10 rendering back to identicons
        run: |
          set -euo pipefail
          OLD_CORE=208debc491bf87714efbf87b08d8b3bae501045a
          git -C vendor/astral-chart-wheel fetch origin "$OLD_CORE"
          git -C vendor/astral-chart-wheel show "$OLD_CORE:src/identiconV10.ts" > src/legacy/renderer/identiconV10.ts

          python3 - <<'PY'
          from pathlib import Path

          renderer = Path('src/legacy/renderer/identiconV10.ts')
          text = renderer.read_text()
          text = text.replace(
              'import type { PointId, Sign } from "./types.js";',
              'import type { PointId } from "../../../vendor/astral-chart-wheel/dist/index.js";\nimport type { Sign } from "../../sign.ts";'
          )
          renderer.write_text(text)

          types = Path('src/legacy/renderer/identiconTypes.ts')
          text = types.read_text()
          if 'PublicWheelMeta' not in text:
              text = text.replace(
                  'import type { Sign } from "../../sign.ts";\n',
                  'import type { Sign } from "../../sign.ts";\nimport type { PublicWheelMeta } from "../../../vendor/astral-chart-wheel/dist/index.js";\n'
              )
          if 'export interface AstralIdenticonV10Request' not in text:
              marker = 'export interface AstralIdenticonV9Request'
              block = '''export interface AstralIdenticonV10Request {\n  readonly input: AstralIdenticonInput;\n  readonly wheel: PublicWheelMeta | null;\n  readonly paletteIndex: number;\n  readonly palette: AstralIdenticonPalette;\n  readonly identityHex: string;\n  readonly parityBytes: readonly number[];\n  readonly recordVersion: number;\n  readonly dataByteCount: number;\n  readonly parityByteCount: number;\n}\n'''
              text = text.replace(marker, block + marker)
          types.write_text(text)

          build = Path('src/build-v10.ts')
          text = build.read_text()
          old = '''import {\n  renderAstralIdenticonV10,\n  type AstralIdenticonAssetSource,\n  type PublicWheelMeta\n} from "../vendor/astral-chart-wheel/dist/index.js";'''
          new = '''import type { PublicWheelMeta } from "../vendor/astral-chart-wheel/dist/index.js";\nimport { renderAstralIdenticonV10 } from "./legacy/renderer/identiconV10.ts";\nimport type { AstralIdenticonAssetSource } from "./legacy/renderer/identiconTypes.ts";'''
          if old not in text:
              raise SystemExit('unexpected import block in src/build-v10.ts')
          build.write_text(text.replace(old, new))

          layout = Path('src/layout.ts')
          text = layout.read_text()
          old = '''import {\n  literalSignGridPlacements,\n  type LiteralSignGridPlacement,\n} from "../vendor/astral-chart-wheel/dist/index.js";'''
          new = '''import { literalSignGridPlacements } from "./legacy/renderer/literalSignGrid.ts";\nimport type { LiteralSignGridPlacement } from "./legacy/renderer/literalSignGrid.ts";'''
          if old not in text:
              raise SystemExit('unexpected import block in src/layout.ts')
          layout.write_text(text.replace(old, new))
          PY

          bun install --frozen-lockfile
          bun run check
          bun test
          bun run build:pages

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/legacy/renderer/identiconV10.ts src/legacy/renderer/identiconTypes.ts src/build-v10.ts src/layout.ts
          git rm .github/workflows/tmp-reclaim-legacy-renderers.yml
          git commit -m "Return v10 renderer to astral-identicons"
          git fetch origin agent/split-modules
          git rebase origin/agent/split-modules
          git push origin HEAD:agent/split-modules
