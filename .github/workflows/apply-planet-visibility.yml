name: Apply planet-only V10 visibility

on:
  push:
    branches:
      - agent/planet-only-v10

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Pin new astrology core and apply renderer filter
        env:
          CORE_SHA: 23271a8ec05a6ceeb34b3f912b7c9c8fa09403d4
        run: |
          git -C vendor/astral-chart-wheel fetch origin "$CORE_SHA"
          git -C vendor/astral-chart-wheel checkout "$CORE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import re

          renderer = Path('src/legacy/renderer/identiconV10.ts')
          text = renderer.read_text()
          if 'pointGlyphVisible' not in text:
              old_import = 'import type { PointId } from "../../../vendor/astral-chart-wheel/dist/index.js";'
              new_import = '''import {
            pointGlyphVisible,
            type PointId,
            type WheelGlyphs,
          } from "../../../vendor/astral-chart-wheel/dist/wheel/index.js";'''
              if old_import not in text:
                  raise SystemExit('V10 PointId import changed unexpectedly')
              text = text.replace(old_import, new_import, 1)

              radii = '''const radii = {
            outer: 372,
            zodiacInner: 316,
            pointBase: 286,
            aspect: 210,
          } as const;'''
              visibility = radii + '''

          const identiconPointGlyphs = {
            default: false,
            collections: { planets: true },
          } as const satisfies WheelGlyphs;'''
              if radii not in text:
                  raise SystemExit('V10 radii block changed unexpectedly')
              text = text.replace(radii, visibility, 1)

              pattern = re.compile(
                  r'  const points = Object\.entries\(request\.wheel\.points\)\n'
                  r'\s+\.flatMap\(\(\[rawId, longitude\]\) => longitude === null\n'
                  r'\s+\? \[\]\n'
                  r'\s+: \[\{ id: rawId as PointId, longitude \}\]\)'
              )
              replacement = '''  const points = Object.entries(request.wheel.points)
            .flatMap(([rawId, longitude]) => {
              const id = rawId as PointId;
              return longitude === null || !pointGlyphVisible(id, identiconPointGlyphs)
                ? []
                : [{ id, longitude }];
            })'''
              replacement = replacement.replace('      .flatMap', '    .flatMap').replace('        const id', '      const id').replace('        return longitude', '      return longitude').replace('          ? []', '        ? []').replace('          : [{', '        : [{').replace('      })', '    })')
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'V10 point layout replacement count was {count}')
              renderer.write_text(text)

          tests = Path('tests/v10.test.ts')
          text = tests.read_text()
          marker = '  test("the 128 parity stars can recover the complete record with every data byte erased", () => {'
          if 'renders only the canonical planetary point collection' not in text:
              addition = '''  test("renders only the canonical planetary point collection", async () => {
            const svg = await buildIdenticon(sample, assets, wheel);
            const planets = [
              "sun", "moon", "mercury", "venus", "mars",
              "jupiter", "saturn", "uranus", "neptune", "pluto"
            ] as const;
            for (const planet of planets) expect(svg).toContain(`wheel-point-${planet}`);
            for (const hidden of [
              "north_node_true", "south_node_true", "north_node_mean", "south_node_mean",
              "ascendant", "descendant", "midheaven", "imum_coeli", "vertex", "antivertex", "east_point",
              "part_of_fortune", "part_of_spirit", "lilith_mean", "lilith_true"
            ] as const) expect(svg).not.toContain(`wheel-point-${hidden}`);
            expect(svg).toContain('id="wheel-houses"');
          });

          '''
              if marker not in text:
                  raise SystemExit('V10 parity test marker changed unexpectedly')
              text = text.replace(marker, addition + marker, 1)
              tests.write_text(text)
          PY
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build:pages
      - name: Commit verified implementation
        run: |
          git add vendor/astral-chart-wheel src/legacy/renderer/identiconV10.ts tests/v10.test.ts
          if git diff --cached --quiet; then
            echo "Implementation already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use core planet collection for V10 point glyphs"
          git push origin HEAD:agent/planet-only-v10
